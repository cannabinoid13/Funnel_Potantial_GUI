[project]
name = "funnelforge"
version = "1.0"
description = "3-D designer, validator and exporter for Desmond well-tempered funnel-metadynamics potentials"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "vtk>=9.1",
    "PyQt5>=5.15",
    "matplotlib>=3.5",
]

[project.scripts]
funnelforge = "funnelforge.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["funnelforge*"]
